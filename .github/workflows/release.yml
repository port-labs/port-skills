name: Release plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude/skills/**'
      - '.claude-plugin/**'
      - '.mcp.json'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-plugin

jobs:
  release:
    if: "!contains(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve next version
        id: bump
        run: echo "version=$(node .github/scripts/bump-plugin-version.js)" >> "$GITHUB_OUTPUT"

      - name: Sync npm package version
        run: npm version "${{ steps.bump.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Tag release
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

      - name: Publish npm package
        run: |
          npm install
          npm publish

      - name: Open manifest sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          BRANCH="release/v$VERSION"

          git checkout -b "$BRANCH"
          git add .claude-plugin/plugin.json package.json package-lock.json
          git commit -m "chore(release): sync manifests to v$VERSION"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): sync manifests to v$VERSION" \
            --body "v$VERSION is already tagged and published to npm. Git tags are the version source of truth, so this PR only updates the committed manifests to match the tag. The next release resolves its version from tags whether or not this merges."

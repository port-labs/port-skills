name: Release plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude/skills/**'
      - '.claude-plugin/**'
      - '.mcp.json'

permissions:
  contents: write

concurrency:
  group: release-plugin

jobs:
  release:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump plugin version
        id: bump
        run: echo "version=$(node .github/scripts/bump-plugin-version.js)" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        run: |
          git add .claude-plugin/plugin.json
          git commit -m "chore(release): bump plugin to v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

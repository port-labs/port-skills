name: Validate skills

on:
  pull_request:
    paths:
      - 'skills/**'
      - '.claude/skills/**'
      - '.claude-plugin/**'
      - '.mcp.json'
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude/skills/**'
      - '.claude-plugin/**'
      - '.mcp.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate SKILL.md files
        run: node .claude/skills/port-skill-creator/scripts/validate-skill.js --all

      - name: Validate port-skill-creator itself
        run: node .claude/skills/port-skill-creator/scripts/validate-skill.js .claude/skills/port-skill-creator

      - name: Check README skill index is up to date
        run: |
          node .claude/skills/port-skill-creator/scripts/generate-skill-index.js
          git diff --exit-code README.md || (echo "README.md skill index is out of date. Run 'node .claude/skills/port-skill-creator/scripts/generate-skill-index.js' and commit the result." && exit 1)

      - name: Check plugin manifest consistency
        run: node .github/scripts/check-plugin-manifest.js

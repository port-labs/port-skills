name: Validate skills

on:
  pull_request:
    paths:
      - 'skills/**'
  push:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate SKILL.md files
        run: node skills/port-skill-creator/scripts/validate-skill.js --all

      - name: Check README skill index is up to date
        run: |
          node skills/port-skill-creator/scripts/generate-skill-index.js
          git diff --exit-code README.md || (echo "README.md skill index is out of date. Run 'node skills/port-skill-creator/scripts/generate-skill-index.js' and commit the result." && exit 1)
